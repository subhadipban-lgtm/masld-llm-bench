[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "masld-platform"
version = "0.1.0"
description = "Production platform for the MASLD-LLM benchmark: corpus management, frontier + local model evaluation, scoring, paired statistics, and Colab/Drive orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "MASLD-LLM" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]
local-model = [
    # Heavy GPU stack; intentionally excluded from the API container image.
    # Tested with: torch 2.14.1, transformers 5.18.0, peft 0.21.2, accelerate 1.15.0.
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.12",
    "accelerate>=0.34",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
masld = "masld_platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "core/masld_platform",
    "api/masld_api",
    "agents/masld_agents",
    "persistence/masld_persistence",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
